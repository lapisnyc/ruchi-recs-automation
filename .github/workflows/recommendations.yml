name: Nightly recommendation sync

on:
  schedule:
    - cron: "0 6 * * *"   # 6:00 UTC, ~1-2am ET
  workflow_dispatch: {}    # manual run button

permissions:
  contents: write          # lets the job commit the Klaviyo feed file

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Run sync
        env:
          SHOPIFY_STORE: ${{ secrets.SHOPIFY_STORE }}
          SHOPIFY_ADMIN_TOKEN: ${{ secrets.SHOPIFY_ADMIN_TOKEN }}
        run: python -m src.main --source api --write-shopify --out out
      - name: Commit Klaviyo feed (served as a Klaviyo web feed)
        run: |
          git config user.name "recs-bot"
          git config user.email "actions@github.com"
          git add feed/klaviyo_recs_feed.json
          git diff --cached --quiet || git commit -m "Update Klaviyo recs feed"
          git push
      - name: Upload outputs (preview + families needing review)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recommendation-outputs
          path: out/
          retention-days: 30
